name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: gates (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.11 only: pydantic ^1.10 + langchain 0.0.208 pins do not
        # support 3.12+ (docs/DECISIONS.md D-G1; modernisation tracked in issues)
        python-version: [ "3.11" ]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2 (pinned SHA)

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (pinned SHA)
        with:
          python-version: ${{ matrix.python-version }}

      - name: Clean install from declared manifest (was impossible before - packaging defect)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e '.[test]'

      - name: Suppression audit (mission rule 4.7)
        run: python scripts/audit_suppressions.py --check

      - name: Tests (unit + ingest + validation + e2e lakehouse)
        run: pytest -q

      - name: Tracked-file drift guard (pipeline runs must not dirty the worktree)
        run: |
          git diff --exit-code
          git ls-files --others --exclude-standard data | (! grep .)
          echo "drift guard clean"
