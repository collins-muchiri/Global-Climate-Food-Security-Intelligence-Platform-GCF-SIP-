version: '3.8'
services:
  api:
    image: python:3.11-slim
    container_name: gcf-sip-api
    volumes:
      - ./src/api:/app
    working_dir: /app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
  db:
    image: postgres:15
    container_name: gcf-sip-db
    environment:
      POSTGRES_USER: gcf
      POSTGRES_PASSWORD: gcf
      POSTGRES_DB: gcfsip
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
